<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Küme</title>
<!-- Copiá este archivo a salidas/AAAA-MM-DD-slug-reel/reel.html y editá SOLO el bloque REEL de abajo.
     Después: python render_reel.py salidas/AAAA-MM-DD-slug-reel/reel.html  → reel.mp4 + portada.png -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/reel-motor.css">
</head>
<body>
<div id="lienzo"></div>
<script>
// =====================================================================================
// EL REEL. Tipos de escena:
//   gancho    → la primera, legible desde el cuadro 0 (frena el scroll). texto, pre (rótulo chico arriba)
//   texto     → una idea por escena, entra palabra por palabra. texto, pre, sub
//   lista     → titulo + items (2 a 4): entran de a uno y el anterior se apaga
//   vs        → izq (se tacha) / der. etiqueta_izq / etiqueta_der opcionales
//   numero    → valor (odómetro gigante), sufijo ("%", "hs", "+"), texto
//   recorrido → img (captura real, ej. Küme HQ) + paradas [{x, y, z, nombre, rol}]: la cámara vuela de una a otra.
//               x / y = punto de la imagen (0 a 1), z = zoom (2 a 3). titulo opcional arriba.
//   pantalla  → img (captura vertical, se desplaza dentro de un celu en 3D) + texto
//   ojitos    → la mascota reacciona (parpadea, mira) + texto
//   cierre    → CTA: la palabra entre *asteriscos* se tipea como un comentario. Lleva el logo (el único lugar donde va).
// Palabras entre *asteriscos* = acento dorado (serif itálica con trazo a mano; en fondo crema, resaltado verde).
// "\n" corta la línea: cada línea se ajusta sola al ancho, así que escribí líneas cortas (2 a 4 palabras).
// fondo (opcional): "verde" | "crema" | "tierra" | "negro" | "foto:../../ruta/a/foto.jpg"
// trans (opcional, cómo ENTRA la escena): "empuje" | "lateral" | "zoom" | "mascara" | "corte". Si no ponés, rota solo.
// dur: segundos (se ajustan al beat). gancho 2 · texto 2–2.5 · lista 4.5–5.5 · recorrido 1.4 por parada · cierre 3–3.5
// audio: "beat" (120 bpm, cultura/trend/opinión) | "suave" (96 bpm, Küme HQ, detrás de escena) | "ninguno"
// serie (opcional): texto del rótulo de cada escena si no tiene pre (ej. "Küme HQ").
// =====================================================================================
window.REEL = {
  audio: "beat",
  serie: "Küme HQ",
  ojitos: "../../assets/logo-ojos.png",
  logo: "../../assets/palabra-crema.png",
  foto_gancho: "../../assets/fotos/escritorio-laptop.jpg",
  escenas: [
    { tipo: "gancho", pre: "Küme HQ", texto: "Esta agencia\ntiene *14 empleados*\nque nunca\nduermen.", dur: 2 },
    { tipo: "texto", texto: "No son\npersonas.\nSon *agentes de IA*.", dur: 2 },
    { tipo: "recorrido", img: "../../assets/capturas/kume-hq-oficina.png", titulo: "Cada uno\ntiene *su puesto*", dur: 6,
      paradas: [
        { x: .585, y: .335, z: 2.4, nombre: "Dwight", rol: "busca clientes" },
        { x: .472, y: .445, z: 2.4, nombre: "Pam", rol: "diseña el contenido" },
        { x: .727, y: .47, z: 2.4, nombre: "Jim", rol: "arma propuestas" },
        { x: .615, y: .585, z: 2.4, nombre: "Andy", rol: "hace el seguimiento" },
      ] },
    { tipo: "numero", valor: 14, texto: "agentes trabajando\n*mientras dormís*", dur: 2.5 },
    { tipo: "vs", etiqueta_izq: "Lo que pensás", izq: "La IA hace\ntodo sola", etiqueta_der: "Lo que pasa", der: "Nada sale\n*sin nuestro ok*", dur: 3 },
    { tipo: "ojitos", texto: "¿Querés ver\ncómo es *por dentro*?", dur: 2 },
    { tipo: "cierre", texto: "Comentá\n*OFICINA*", sub: "y te mostramos cómo trabaja", dur: 3.5 },
  ],
};
</script>
<script src="../../assets/reel-motor.js"></script>
</body>
</html>
