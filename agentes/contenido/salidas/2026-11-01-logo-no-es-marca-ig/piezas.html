<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post único — tu logo no es tu marca (estilo feed Küme)</title>
<link rel="stylesheet" href="../../assets/estilo-ig.css">
<script src="../../assets/garabatos.js"></script>
<style>
  /* carta dibujada: renglones grises y la "firma" abajo */
  .carta { padding: 40px 44px; }
  .carta i { display: block; height: 14px; border-radius: 7px; background: #DDD6CA; margin-bottom: 22px; }
  .recorte.carta .firma { position: absolute; right: 40px; bottom: 34px; width: 150px; height: auto; object-fit: contain; }
  .rotulo { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 40px; color: #fff; }
</style>
</head>
<body>

<!-- POST ÚNICO -->
<section class="slide foto" data-foto="../../assets/fotos/escritorio-planta.jpg">
  <div class="pre" style="top:130px">Spoiler:</div>
  <div class="titulo" style="top:200px">tu logo <em>no es</em> tu marca.</div>
  <div class="recorte carta" style="left:330px;top:470px;width:420px;height:360px;transform:rotate(-3deg)">
    <i style="width:70%"></i><i></i><i></i><i style="width:85%"></i><i style="width:60%"></i>
    <img class="firma" src="../../assets/palabra-verde.png" alt="küme">
  </div>
  <div class="rotulo" style="left:90px;top:520px;transform:rotate(-6deg)">la carta</div>
  <span class="garabato" data-g="flecha" style="left:120px;top:590px;width:180px;transform:rotate(10deg)"></span>
  <div class="rotulo" style="left:800px;top:820px;transform:rotate(5deg)">la firma</div>
  <span class="garabato" data-g="flechaCurva" style="left:770px;top:690px;width:150px;transform:scaleX(-1) rotate(20deg)"></span>
  <div class="sub" style="top:900px">Marca es qué decís, cómo atendés y por qué te eligen. <b>El logo es la firma, no la carta.</b></div>
  <img class="logo-chico" src="../../assets/logo-crema.png" alt="küme agencia creativa">
</section>

</body>
</html>
